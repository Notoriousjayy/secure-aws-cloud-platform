name: Terraform static validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize dev without remote backend
        run: terraform -chdir=environments/dev init -backend=false -input=false
      - name: Validate dev
        run: terraform -chdir=environments/dev validate
# No cloud credentials are granted and no plan/apply is performed.
